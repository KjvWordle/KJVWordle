<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stats — KJV Wordle</title>
<link rel="stylesheet" href="site.css">
<style>
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;padding:44px 0 8px}
.top h1{font-size:40px;margin-top:8px}
.top p{margin:6px 0 0;color:var(--muted)}
section{margin-top:36px}
section>h2{font-size:24px;margin-bottom:4px}
section>.note{color:var(--muted);font:14px system-ui,sans-serif;margin:0 0 16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:18px 20px}
.kpi .v{font:700 34px system-ui,sans-serif;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font:600 12px system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.card h3{font:700 13px system-ui,sans-serif;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.dist{display:grid;gap:7px;font:600 14px system-ui,sans-serif}
.dist .r{display:grid;grid-template-columns:16px 1fr;gap:10px;align-items:center}
.dist .bar{height:24px;background:var(--tile);min-width:28px;border-radius:3px;color:#fff;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-variant-numeric:tabular-nums;transition:width .6s ease}
.dist .bar.hi{background:var(--g)}
.dist .bar.zero{color:var(--fg);background:transparent;border:1px dashed var(--tile);justify-content:flex-start}
.games{list-style:none;margin:0;padding:0;font:14px system-ui,sans-serif}
.games li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.games li:last-child{border:0}
.pill{font:700 12px system-ui,sans-serif;padding:3px 9px;border-radius:99px;color:#fff;background:var(--g)}
.pill.x{background:var(--b)}.pill.p{background:var(--o)}
.cols{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}
.cols .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font:600 11px system-ui,sans-serif;color:var(--muted);min-width:0}
.cols .s{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;border-radius:3px 3px 0 0;overflow:hidden;min-height:2px;background:var(--line)}
.cols .s i{display:block;background:var(--g)}.cols .s u{display:block;background:var(--tile)}
.cols .c.today .s{outline:2px solid var(--o);outline-offset:2px}
.legend{display:flex;gap:16px;font:13px system-ui,sans-serif;color:var(--muted);margin-top:14px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--g);vertical-align:-1px}
.legend span.u::before{background:var(--tile)}
.empty{color:var(--muted);font:14px system-ui,sans-serif;padding:16px 0}
.alltime{font:14px system-ui,sans-serif;color:var(--muted);margin-top:14px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="site"><div class="wrap">
  <a class="brand" href="index.html"><i>K</i><span>KJV WORDLE</span></a>
  <nav><a href="how-to-play.html">How to play</a><a href="dashboard.html" aria-current="page">Stats</a><a href="play.html">Play</a></nav>
</div></header>

<main class="wrap">
  <div class="top">
    <div><div class="eyebrow">Dashboard</div><h1>Statistics</h1><p id="when"></p></div>
    <a class="btn primary" href="play.html" id="cta">Play today’s puzzle</a>
  </div>

  <section>
    <h2>Your stats</h2>
    <p class="note">Saved in this browser.</p>
    <div class="kpis">
      <div class="card kpi"><div class="v" id="p-played">0</div><div class="l">Played</div></div>
      <div class="card kpi"><div class="v" id="p-win">–</div><div class="l">Win rate</div></div>
      <div class="card kpi"><div class="v" id="p-streak">0</div><div class="l">Current streak</div></div>
      <div class="card kpi"><div class="v" id="p-max">0</div><div class="l">Best streak</div></div>
    </div>
    <div class="grid2">
      <div class="card"><h3>Guess distribution</h3><div class="dist" id="p-dist"></div></div>
      <div class="card"><h3>Recent games</h3><ul class="games" id="p-games"></ul></div>
    </div>
  </section>

</main>

<footer class="site"><div class="wrap"><span>KJV Wordle</span><span><a href="play.html">Play</a> · <a href="how-to-play.html">How to play</a> · <a href="index.html">Home</a></span></div></footer>

<script>
// Must match the puzzle numbering in /play
const EPOCH=Date.UTC(2026,10,1),now=new Date();
const num=Math.max(0,Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-EPOCH)/864e5));
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString();
const dateOf=p=>new Date(EPOCH+p*864e5).toLocaleDateString(undefined,{timeZone:"UTC",month:"short",day:"numeric"});
$("when").textContent=now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})+" · Puzzle #"+(num+1);

function dist(el,counts,hi){const max=Math.max(...counts,1);
el.innerHTML=counts.map((n,i)=>'<div class="r"><span>'+(i+1)+'</span><div class="bar'+(n?(i+1==hi?" hi":""):" zero")+'" style="width:'+(n?Math.max(8,n/max*100):0)+'%">'+fmt(n)+'</div></div>').join("")}

// Personal stats from localStorage (one "kjvw<puzzle>" entry per day)
const games={};
for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i),m=/^kjvw(\d+)$/.exec(k);if(!m)continue;
try{const s=JSON.parse(localStorage.getItem(k));if(s&&s.g&&s.g.length)games[+m[1]]=s}catch(e){}}
const done=Object.keys(games).map(Number).filter(p=>games[p].done).sort((a,b)=>a-b);
const won=done.filter(p=>games[p].won);
let max=0,run=0,prev=null;
for(const p of done){run=games[p].won?(prev===p-1?run+1:1):0;max=Math.max(max,run);prev=p}
let streak=0;{let p=games[num]&&games[num].done?num:num-1;while(games[p]&&games[p].done&&games[p].won){streak++;p--}}
$("p-played").textContent=fmt(done.length);
$("p-win").textContent=done.length?Math.round(won.length/done.length*100)+"%":"–";
$("p-streak").textContent=streak;$("p-max").textContent=max;
const pd=[0,0,0,0,0,0];won.forEach(p=>pd[games[p].g.length-1]++);
const todayG=games[num];
if(won.length)dist($("p-dist"),pd,todayG&&todayG.won?todayG.g.length:0);
else $("p-dist").innerHTML='<div class="empty">Win a game to see how many guesses you usually need.</div>';
const recent=Object.keys(games).map(Number).sort((a,b)=>b-a).slice(0,6);
$("p-games").innerHTML=recent.length?recent.map(p=>{const s=games[p];
const pill=!s.done?'<span class="pill p">In progress</span>':s.won?'<span class="pill">'+s.g.length+'/6</span>':'<span class="pill x">X/6</span>';
return '<li><span>#'+(p+1)+' · '+dateOf(p)+'</span>'+pill+'</li>'}).join(""):'<li class="empty">No games yet. <a href="play.html">Play today’s puzzle</a>.</li>';
if(todayG&&todayG.done)$("cta").textContent="Back to today’s game";

</script>
</body>
</html>
