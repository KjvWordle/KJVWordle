<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>KJV Wordle</title><style>
:root{--bg:#fbf8f1;--fg:#222;--tile:#d3cfc4;--g:#538d4e;--o:#e08a1e;--b:#3a3a3c;--key:#d3cfc4}
@media(prefers-color-scheme:dark){:root{--bg:#121213;--fg:#f4f4f4;--tile:#3a3a3c;--key:#818384}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Georgia,serif}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom)}
h1{margin:10px 0 2px;font-size:26px;letter-spacing:2px}.sub{font-size:12px;opacity:.7;margin-bottom:6px}
#msg{height:24px;font:600 14px sans-serif}
#board{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;margin:6px 0}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.t{width:min(14vw,58px);height:min(14vw,58px);border:2px solid var(--tile);display:flex;align-items:center;justify-content:center;font:700 28px sans-serif;text-transform:uppercase}
.t.f{border-color:#888}.t.sel{border-color:var(--o);box-shadow:0 0 0 2px var(--o)}.t{cursor:pointer;touch-action:manipulation}.t.g,.t.o,.t.b{color:#fff;border-color:transparent}
.g{background:var(--g)}.o{background:var(--o)}.b{background:var(--b)}
.shake{animation:sh .5s}@keyframes sh{0%,100%{transform:translateX(0)}11.11%,33.33%,55.56%,77.78%{transform:translateX(-7px)}22.22%,44.44%,66.67%,88.89%{transform:translateX(7px)}}.flip{animation:fl .5s ease-in-out}.k.ent{font-size:30px;line-height:1}@keyframes fl{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
#kb{width:100%;max-width:500px;margin-top:auto;padding-bottom:8px}
.kr{display:flex;gap:5px;justify-content:center;margin:5px 0}
.k{flex:1;height:52px;border:0;border-radius:4px;background:var(--key);color:var(--fg);font:700 14px sans-serif;text-transform:uppercase;padding:0}
.k.g,.k.o,.k.b{color:#fff}.k.g{background:var(--g)}.k.o{background:var(--o)}.k.b{background:var(--b)}.k.wide{flex:1.6}
nav{width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center;font:600 13px sans-serif;padding-top:8px}nav a{color:inherit;text-decoration:none;opacity:.75}nav a:hover{opacity:1}nav span{display:flex;gap:14px}
#end a{display:inline-block;margin-left:8px;font:700 16px sans-serif;padding:10px 18px;border-radius:6px;border:2px solid var(--g);color:var(--g);text-decoration:none}
#end{display:none;text-align:center;margin:6px}
#end button{font:700 16px sans-serif;padding:10px 18px;border:0;border-radius:6px;background:var(--g);color:#fff}

const EPOCH=Date.UTC(2026,10,1);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const order=ANS.slice();{const r=rng(20261101);for(let i=order.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}
const now=new Date(),today=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
const num=Math.max(0,Math.round((today-EPOCH)/864e5)),ANSWER=order[num%order.length];
document.getElementById("sub").textContent=now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})+" (Puzzle #"+(num+1)+")";
const KEY="kjvw"+num;let st;try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
st=st||{g:[],done:false,won:false};let cur=["","","","",""],sel=0;
function score(g,a){const r=Array(5).fill("b"),u={};for(let i=0;i<5;i++){if(g[i]==a[i])r[i]="g";else u[a[i]]=(u[a[i]]||0)+1}
for(let i=0;i<5;i++)if(r[i]=="b"&&u[g[i]]>0){r[i]="o";u[g[i]]--}return r}
const board=document.getElementById("board"),rows=[];
for(let i=0;i<6;i++){const r=document.createElement("div");r.className="row";const ts=[];for(let j=0;j<5;j++){const t=document.createElement("div");t.className="t";t.onclick=()=>{if(st.done||anim>=0||i!=st.g.length)return;sel=j;paint()};r.appendChild(t);ts.push(t)}board.appendChild(r);rows.push({r,ts})}
const kb=document.getElementById("kb"),keys={};
["qwertyuiop","asdfghjkl","+zxcvbnm-"].forEach(l=>{const d=document.createElement("div");d.className="kr";for(const c of l){const b=document.createElement("button");b.className="k";b.textContent=c=="+"?"↵":c=="-"?"⌫":c;if(c=="+"||c=="-")b.classList.add("wide");if(c=="+")b.classList.add("ent");b.onclick=()=>press(c=="+"?"Enter":c=="-"?"Backspace":c);d.appendChild(b);keys[c]=b}kb.appendChild(d)});
const rank={b:1,o:2,g:3};
let anim=-1;function paint(){rows.forEach((x,i)=>{const g=st.g[i];x.ts.forEach((t,j)=>{t.className="t";t.textContent="";if(g){t.textContent=g[j];if(i!=anim)t.classList.add(score(g,ANSWER)[j])}else if(i==st.g.length&&!st.done){if(cur[j]){t.textContent=cur[j];t.classList.add("f")}if(j==sel&&anim<0)t.classList.add("sel")}})});
const best={};st.g.forEach((g,gi)=>gi!=anim&&score(g,ANSWER).forEach((s,j)=>{if(!best[g[j]]||rank[s]>rank[best[g[j]]])best[g[j]]=s}));
for(const c in keys){if(c.length==1&&/[a-z]/.test(c)){keys[c].className="k"+(best[c]?" "+best[c]:"")}}
if(st.done&&anim<0){document.getElementById("end").style.display="block";document.getElementById("res").textContent=st.won?"Great job! 🙌 Solved in "+st.g.length+"/6":"The word was "+ANSWER.toUpperCase()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function pid(){let id;try{id=localStorage.getItem("kjvw-player");if(!id){id=crypto.randomUUID();localStorage.setItem("kjvw-player",id)}}catch(e){id=crypto.randomUUID()}return id}
async function submit(){return;if(!st.done||st.sent)return;try{const r=await fetch("/api/results",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({puzzle:num,playerId:pid(),won:st.won,guesses:st.g.length})});if(r.ok||r.status==400){st.sent=true;save()}}catch(e){}}
function msg(m,ms){const e=document.getElementById("msg");e.textContent=m;setTimeout(()=>e.textContent="",ms||1500)}
function press(k){if(st.done||anim>=0)return;
if(k=="Backspace"){if(cur[sel])cur[sel]="";else if(sel>0){sel--;cur[sel]=""}}
else if(k=="Enter"){const w=cur.join("");if(w.length<5){shake();return msg("Not enough letters")}
if(!ALL.has(w)){shake();return msg("Not in word list",2200)}
st.g.push(w);if(w==ANSWER){st.done=st.won=true}else if(st.g.length==6)st.done=true;cur=["","","","",""];sel=0;save();reveal();if(st.done)submit();return}
else if(/^[a-z]$/.test(k)){cur[sel]=k;for(let d=1;d<5;d++){const x=(sel+d)%5;if(!cur[x]){sel=x;break}}}
paint()}
function reveal(){const i=st.g.length-1,g=st.g[i],sc=score(g,ANSWER);anim=i;paint();rows[i].ts.forEach((t,j)=>setTimeout(()=>{t.classList.add("flip");setTimeout(()=>{t.classList.add(sc[j])},250)},j*350));setTimeout(()=>{anim=-1;paint()},4*350+600)}
function shake(){const r=rows[st.g.length].r;r.classList.remove("shake");void r.offsetWidth;r.classList.add("shake")}
document.addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;press(e.key.length==1?e.key.toLowerCase():e.key)});
document.getElementById("share").onclick=async()=>{const em={g:"🟩",o:"🟧",b:"⬛"};const U=location.origin+location.pathname;
const txt="KJV Wordle #"+(num+1)+" "+(st.won?st.g.length:"X")+"/6\n\n"+st.g.map(g=>score(g,ANSWER).map(s=>em[s]).join("")).join("\n");
try{if(navigator.share){await navigator.share({text:txt+"\n\n"+U});return}}catch(e){}
try{await navigator.clipboard.writeText(txt+"\n\n"+U);msg("Copied to clipboard")}catch(e){prompt("Copy:",txt+"\n\n"+U)}};
function tick(){const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n,h=Math.floor(m/36e5),mi=Math.floor(m%36e5/6e4);document.getElementById("cd").textContent="Next puzzle in "+h+"h "+mi+"m"}
tick();setInterval(tick,3e4);paint();submit();
</script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
